[package]
name = "chart_player"
version = "0.1.0"
edition = "2021"
authors = ["ChartPlayer Team"]
description = "A music chart player for Guitar Hero/Rock Band style games"

[lib]
name = "chart_player"
path = "src/lib.rs"

[[bin]]
name = "chart_player"
path = "src/main.rs"

[[bin]]
name = "image_processor"
path = "src/image_processor.rs"

[dependencies]
# Graphics (using winit + glow for cross-platform rendering)
winit = "0.29"
glow = "0.17"
image = "0.25"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"

# Math utilities
nalgebra = "0.33"
cgmath = "0.18"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

[features]
default = []